name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64 (static)
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - name: Linux x86_64 (glibc)
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - name: macOS universal
            os: macos-latest
            target: universal-apple-darwin

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          # macOS builds both architectures and combines them with `lipo`.
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Build and package
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist/stage

          if [ "${{ matrix.os }}" = "macos-latest" ]; then
            cargo build --release --target aarch64-apple-darwin
            cargo build --release --target x86_64-apple-darwin
            lipo -create -output dist/stage/booxmtp \
              target/aarch64-apple-darwin/release/booxmtp \
              target/x86_64-apple-darwin/release/booxmtp
            # Ad-hoc signature; the binary is still not notarised.
            codesign --force --sign - dist/stage/booxmtp
          else
            if [ "${{ matrix.target }}" = "x86_64-unknown-linux-musl" ]; then
              sudo apt-get update -qq
              sudo apt-get install -y -qq musl-tools
            fi
            cargo build --release --target "${{ matrix.target }}"
            cp "target/${{ matrix.target }}/release/booxmtp" dist/stage/booxmtp
          fi

          cp LICENSE README.md README.de.md dist/stage/
          tar -czf "dist/booxmtp-${version}-${{ matrix.target }}.tar.gz" -C dist/stage .
          rm -rf dist/stage
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          sha256sum *.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" dist/* \
              --title "booxmtp $tag" \
              --notes-file .github/release-notes.md
          fi
