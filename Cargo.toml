[package]
name = "booxmtp"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
description = "MTP file transfer CLI and Midnight-Commander-style TUI for Android e-readers (BOOX)"
license = "MIT"
readme = "README.md"
repository = "https://github.com/Harleaquin/booxmtp"
keywords = ["mtp", "boox", "tui", "file-transfer", "ebook"]
categories = ["command-line-utilities", "filesystem"]

[dependencies]
async-recursion = "1.2.0"
clap = { version = "4.6.7", features = ["derive"] }
mtp-rs = { version = "0.37", features = ["tracing"] }
ratatui = "0.30"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "fs", "io-util", "signal", "sync", "process", "time"] }
tokio-util = { version = "0.7.20", features = ["io"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }

[dev-dependencies]
mtp-rs = { version = "0.37", features = ["virtual-device"] }
tempfile = "3.27.0"
